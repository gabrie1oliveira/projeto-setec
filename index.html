<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Aventura Pixel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <canvas id="game-canvas" aria-label="Jogo Aventura Pixel"></canvas>
    <section id="menu" class="panel">
      <p class="eyebrow">UMA JORNADA EM PIXEL</p><h1>Aventura<br><span>Pixel</span></h1>
      <p class="tagline">Corra. Pule. Descubra.</p>
      <button id="start-button" class="primary">Jogar agora <b>Enter</b></button>
      <p class="keys">Setas ou A/D para mover · Espaço para pular · X para fogo · P para pausar</p>
    </section>
    <section id="pause-panel" class="panel hidden"><p class="eyebrow">JOGO PAUSADO</p><h2>Faça uma pausa</h2><button id="resume-button" class="primary">Continuar</button><button id="menu-button">Menu principal</button></section>
    <section id="end-panel" class="panel hidden"><p id="end-kicker" class="eyebrow">FIM DA FASE</p><h2 id="end-title">Você conseguiu!</h2><p id="end-text"></p><button id="end-button" class="primary">Jogar novamente</button><button id="end-menu-button">Menu principal</button></section>
    <div id="hud" class="hud hidden"><span>FASE <b id="level-value">1</b></span><span>♥ <b id="lives-value">3</b></span><span>◈ <b id="coins-value">0</b></span><span>★ <b id="score-value">0</b></span><button id="pause-button" aria-label="Pausar">Ⅱ</button></div>
    <div id="touch-controls" class="touch-controls hidden"><div><button data-key="left">◀</button><button data-key="right">▶</button></div><div><button data-key="run">◆</button><button data-key="jump" class="jump">▲</button></div></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
